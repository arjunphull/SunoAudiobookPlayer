plugins {
    id 'com.android.application'
}

android {
    defaultConfig {
        applicationId "com.github.arjunphull.sunoaudiobookplayer"
        minSdkVersion 26
        targetSdk 37
        versionCode 21
        versionName '1.0.18'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true // Enables explicit generation for this module
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('libs/taglib/CMakeLists.txt')
        }
    }
    namespace = 'com.github.arjunphull.sunoaudiobookplayer'
    ndkVersion = '29.0.14206865'
    buildToolsVersion = '35.0.0'
    compileSdk = 37
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    testImplementation 'junit:junit:'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}